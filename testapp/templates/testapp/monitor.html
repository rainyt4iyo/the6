<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/monitor.css') }}"/>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <title>THE|6 MONITOR — GRADE {{ grade }}</title>
</head>
<body>
    <header class="page-header">
        <img class="header-banner" src="/static/images/banner_1280p.png" alt="THE|6">
        <div class="header-meta">
            <span class="header-title">LIVE RESULTS</span>
            <span class="header-grade">GRADE {{ grade }}</span>
            <span id="status" class="status">接続中...</span>
        </div>
    </header>

    <main id="monitor-grid" class="monitor-grid">
        {% for cls in classes_data %}
        <section class="ranking-panel" id="panel-{{ cls.class_name }}">
            <h2 class="panel-title">{{ cls.class_name }}</h2>
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>RANK</th>
                        <th>No</th>
                        <th>NAME</th>
                        <th>PT</th>
                    </tr>
                </thead>
                <tbody id="tbody-{{ cls.class_name }}">
                    {% for player in cls.players %}
                    <tr>
                        <td class="col-rank rank-{{ player.rank }}">{{ player.rank }}</td>
                        <td class="col-pid">{{ player.pid }}</td>
                        <td class="col-name">{{ player.name }}</td>
                        <td class="col-point">{{ player.point }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
        {% endfor %}
    </main>

    <script>
        const grade      = {{ grade }};
        const gradeList  = {{ grade_list | tojson }};
        const statusEl   = document.getElementById('status');

        // 初期データ（Jinja2からそのまま受け取る）
        const initialData = {{ classes_data | tojson }};

        function renderClass(cls) {
            const tbody = document.getElementById(`tbody-${cls.class_name}`);
            if (!tbody) return;
            tbody.innerHTML = cls.players.map(p => `
                <tr>
                    <td class="col-rank rank-${p.rank}">${p.rank}</td>
                    <td class="col-pid">${p.pid}</td>
                    <td class="col-name">${p.name}</td>
                    <td class="col-point">${p.point ?? 0}</td>
                </tr>
            `).join('');
        }

        function renderAll(classesData) {
            classesData.forEach(cls => renderClass(cls));
        }

        function connectSSE() {
            const es = new EventSource(`/monitor/${grade}/stream`);

            es.onopen = () => {
                statusEl.textContent = '🟢 ライブ更新中';
                statusEl.className = 'status status-live';
            };

            es.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.error) { console.error('SSE error:', data.error); return; }

                renderAll(data);

                const now = new Date().toLocaleTimeString('ja-JP');
                statusEl.textContent = `🟢 ライブ更新中　${now}`;
                statusEl.className = 'status status-live';
            };

            es.onerror = () => {
                statusEl.textContent = '🔴 再接続中...';
                statusEl.className = 'status status-error';
                es.close();
                setTimeout(connectSSE, 5000);
            };
        }

        // グリッド列数をクラス数に合わせて自動設定
        const grid = document.getElementById('monitor-grid');
        const colCount = gradeList.length;
        grid.classList.add(`cols-${colCount}`);

        // 初期描画
        renderAll(initialData);
        connectSSE();
    </script>
</body>
</html>
